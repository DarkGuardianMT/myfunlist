name: Review Tier Lists backend tests

on:
  push:
    branches: [review/tier-lists-backend-api]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: myfunlist_test
      DB_USERNAME: tier_lists_ci
      DB_PASSWORD: disposable-ci-only
      TIER_LISTS_ENABLED: 'false'
      OPEN_LIBRARY_PILOT_ENABLED: 'false'
      OPEN_LIBRARY_PUBLIC_ACCESS_ENABLED: 'false'
      GOOGLE_BOOKS_API_KEY: ''
      TMDB_API_TOKEN: ''
      RAWG_API_KEY: ''
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: myfunlist_test
          MARIADB_USER: tier_lists_ci
          MARIADB_PASSWORD: disposable-ci-only
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,size=512m
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql, posix
          coverage: none
          tools: composer:v2

      - name: Verify commit, tools and PHP syntax
        run: |
          set -euo pipefail
          . /etc/os-release
          printf 'Runner OS %s\n' "$PRETTY_NAME"
          node --version
          php --version
          composer --version
          php -r 'foreach (["curl", "pdo_mysql", "posix"] as $extension) {
              if (!extension_loaded($extension)) { fwrite(STDERR, "Missing extension: $extension\n"); exit(1); }
          }'
          test "$(node --version)" = v24.15.0
          test "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = 8.2
          test ! -e .env && test ! -e backend/.env
          git diff --check ee32a71524a2d161d45d9847d6ee051074a8403f...HEAD
          git diff --exit-code 96f881822fcabb39da7314dc09145514738cdcb9 HEAD -- . ':(exclude).github/workflows/review-tier-lists-backend-test.yml'
          find backend/src backend/config backend/public backend/bin backend/tests backend/database \
            -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          composer --working-dir=backend validate --strict

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          composer --working-dir=backend install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Verify the disposable database target
        env:
          SERVICE_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          php backend/tests/database_safety.php
          test "$(docker inspect --format '{{.Config.Image}}' "$SERVICE_CONTAINER")" = mariadb:10.11
          test "$(docker port "$SERVICE_CONTAINER" 3306/tcp)" = 127.0.0.1:3306
          test "$(docker inspect --format '{{index .HostConfig.Tmpfs "/var/lib/mysql"}}' "$SERVICE_CONTAINER")" = rw,size=512m
          export CI_DB_HOSTNAME="$(docker inspect --format '{{.Config.Hostname}}' "$SERVICE_CONTAINER")"
          php <<'PHP'
          <?php
          require 'backend/config/environment.php';
          require 'backend/tests/support/database.php';
          $config = MyFunList\Config::database();
          assertSafeTestDatabase($config, getenv('APP_ENV'));
          if ($config['host'] !== '127.0.0.1' || $config['port'] !== 3306 || getenv('TIER_LISTS_ENABLED') !== 'false') {
              throw new RuntimeException('Unsafe CI test settings.');
          }
          $database = (new MyFunList\Infrastructure\Database())->connect();
          $server = $database->query('SELECT DATABASE(), @@hostname, @@port, VERSION()')->fetch(PDO::FETCH_NUM);
          if ($server[0] !== 'myfunlist_test' || $server[1] !== getenv('CI_DB_HOSTNAME') || (int) $server[2] !== 3306
              || !preg_match('/^10\.11\..*MariaDB/', $server[3]) || $database->query('SHOW TABLES')->fetch() !== false) {
              throw new RuntimeException('The connection does not point to the fresh MariaDB service.');
          }
          printf("Verified APP_ENV=testing, TIER_LISTS_ENABLED=false, %s:%d/%s, MariaDB %s on the job service.\n",
              $config['host'], $config['port'], $server[0], $server[3]);
          PHP
          root="$(mktemp -d "$RUNNER_TEMP/tier-lists-review.XXXXXX")"
          mkdir -m 700 "$root/php" "$root/sessions" "$root/node" "$root/prior"
          printf 'TIER_LISTS_CI_DIR=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Rehearse migration and check real transaction rollback
        run: |
          set -euo pipefail
          cp backend/database/migrations/00[1-5]_*.php "$TIER_LISTS_CI_DIR/prior/"
          php <<'PHP'
          <?php
          use MyFunList\Auth\AuthenticatedUser;
          use MyFunList\Infrastructure\Database;
          use MyFunList\Infrastructure\Migrations\MigrationRunner;
          use MyFunList\TierLists\TierListService;

          require 'backend/config/environment.php';
          require 'backend/tests/support/database.php';
          assertSafeTestDatabase(MyFunList\Config::database(), getenv('APP_ENV'));
          $database = new Database();
          $connection = $database->connect();
          $target = 'myfunlist_test';
          $version = '006_create_tier_lists';
          $runner = new MigrationRunner($connection, 'backend/database/migrations', $target);
          $check = static function (bool $condition, string $message): void {
              if (!$condition) throw new RuntimeException($message);
          };
          $prior = (new MigrationRunner($connection, getenv('TIER_LISTS_CI_DIR') . '/prior', $target))->migrate();
          $check(count($prior) === 5 && array_unique(array_values($prior)) === ['applied'], 'Expected migrations 001–005.');
          $app = require 'backend/config/bootstrap.php';
          foreach ([['GET', ''], ['POST', ''], ['GET', '/1'], ['PUT', '/1'], ['DELETE', '/1']] as [$method, $suffix]) {
              $check($app->handle($method, '/api/v1/tier-lists' . $suffix)->status === 404, 'Disabled route must return 404.');
          }
          $connection->exec("INSERT INTO users (email,password_hash) VALUES ('workflow-fixture@example.test','synthetic')");
          $user = new AuthenticatedUser($connection->lastInsertId());
          $connection->exec("INSERT INTO media (source,media_type,source_id,title,metadata) VALUES ('tmdb','movie','123','Fixture','{}')");
          $media = $connection->lastInsertId();
          $connection->prepare("INSERT INTO user_media (user_id,media_id,status) VALUES (?,?,'watched')")->execute([$user->id, $media]);
          $entry = $connection->lastInsertId();
          $connection->prepare("INSERT INTO lists (user_id,title) VALUES (?,'Fixture')")->execute([$user->id]);
          $list = $connection->lastInsertId();
          $connection->prepare('INSERT INTO list_items (list_id,user_media_id) VALUES (?,?)')->execute([$list, $entry]);
          $tables = ['users', 'media', 'user_media', 'lists', 'list_items', 'rate_limit_counters', 'open_library_state'];
          $before = [];
          foreach ($tables as $table) $before[$table] = $connection->query("SELECT * FROM $table")->fetchAll();
          $applied = $runner->migrate();
          $check($applied[$version] === 'applied' && count(array_filter($applied, static fn ($state) => $state === 'already applied')) === 5,
              'Expected an additive upgrade to 006.');
          foreach ($tables as $table) {
              $check($before[$table] === $connection->query("SELECT * FROM $table")->fetchAll(), "Migration changed $table.");
          }
          $check(array_unique(array_values($runner->migrate())) === ['already applied'], 'Migration rerun must skip applied versions.');
          echo "Migrations 001–006 passed. Rerun skipped all six. Existing Library and Custom List rows were preserved.\n";

          $service = new TierListService($database);
          $board = $service->create($user, ['title' => 'Original'], null)['board'];
          $item = (object) ['source' => 'tmdb', 'mediaType' => 'movie', 'sourceId' => '123'];
          $draft = ['title' => 'Original', 'description' => null, 'allowedTypes' => ['movie'], 'revision' => 1,
              'tiers' => [(object) ['key' => 's', 'name' => 'S', 'color' => 'Lime', 'items' => [$item]]], 'unranked' => []];
          $before = $service->save($user, $board['id'], static fn (): array => $draft);
          $connection->exec("CREATE TRIGGER ci_fail_tier_list_update BEFORE UPDATE ON tier_lists FOR EACH ROW
              SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'CI synthetic update failure'");
          try {
              $changed = array_replace($draft, [
                  'title' => 'Changed', 'revision' => 2,
                  'tiers' => [(object) ['key' => 'a', 'name' => 'A', 'color' => 'Amber', 'items' => []]],
                  'unranked' => [$item],
              ]);
              try {
                  $service->save($user, $board['id'], static fn (): array => $changed);
                  throw new RuntimeException('Expected a late save failure.');
              } catch (PDOException $exception) {
                  $check($exception->getCode() === '45000' && str_contains($exception->getMessage(), 'CI synthetic update failure'),
                      'Unexpected database failure.');
              }
              $check($service->get($user, $board['id']) === $before, 'A failed write changed the stored board.');
          } finally {
              $connection->exec('DROP TRIGGER ci_fail_tier_list_update');
          }
          $connection->prepare('DELETE FROM users WHERE id = ?')->execute([$user->id]);
          $check((int) $connection->query('SELECT COUNT(*) FROM media')->fetchColumn() === 1, 'Deletion must preserve shared media.');
          $connection->prepare('DELETE FROM media WHERE id = ?')->execute([$media]);
          echo "MariaDB rolled back a late save failure. Original revision, tier and item placement were preserved.\n";
          PHP

      - name: Run full PHP suite and focused Tier Lists validation
        run: |
          set -euo pipefail
          export TMPDIR="$TIER_LISTS_CI_DIR/php"
          export SESSION_SAVE_PATH="$TIER_LISTS_CI_DIR/sessions"
          export https_proxy=http://127.0.0.1:1 http_proxy=http://127.0.0.1:1
          export no_proxy=127.0.0.1,localhost
          composer --working-dir=backend test
          php backend/tests/tier_lists_api.php
          composer --working-dir=backend run test:tier-lists-mysql

      - name: Run frontend unit tests and build
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
        run: |
          set -euo pipefail
          TMPDIR="$TIER_LISTS_CI_DIR/node" npm test | tee "$RUNNER_TEMP/tier-lists-frontend.log"
          grep -Eq ' skipped 0$' "$RUNNER_TEMP/tier-lists-frontend.log"
          npm run build

      - name: Verify fixture cleanup and final diff
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'backend/config/environment.php';
          $db = (new MyFunList\Infrastructure\Database())->connect();
          foreach (['users', 'media', 'user_media', 'lists', 'list_items', 'tier_lists', 'tier_list_tiers', 'tier_list_items'] as $table) {
              if ((int) $db->query("SELECT COUNT(*) FROM $table")->fetchColumn() !== 0) {
                  throw new RuntimeException("Unexpected fixture rows in $table.");
              }
          }
          if ((int) $db->query('SELECT COUNT(*) FROM schema_migrations')->fetchColumn() !== 6
              || $db->query('SHOW TRIGGERS')->fetch() !== false) {
              throw new RuntimeException('Unexpected migration or trigger state.');
          }
          echo "No account, catalogue, Library, Custom List or Tier List fixture rows remain. Six migrations and no triggers remain.\n";
          PHP
          test -z "$(find "$TIER_LISTS_CI_DIR/node" -mindepth 1 -print -quit)"
          for dir in "$TIER_LISTS_CI_DIR/php" "$TIER_LISTS_CI_DIR/sessions"; do
            test -z "$(find "$dir" -mindepth 1 ! -name 'sess_*' -print -quit)"
            find "$dir" -maxdepth 1 -type f -name 'sess_*' -delete
            rmdir "$dir"
          done
          rm -- "$TIER_LISTS_CI_DIR"/prior/00[1-5]_*.php "$RUNNER_TEMP/tier-lists-frontend.log"
          rmdir "$TIER_LISTS_CI_DIR/prior" "$TIER_LISTS_CI_DIR/node" "$TIER_LISTS_CI_DIR"
          git diff --check
          test -z "$(git status --porcelain=v1)"
          echo "Synthetic sessions and test scratch files cleaned. Working tree is clean."
