name: Activate Tier Lists on staging

on:
  push:
    branches: [ops/staging-tier-lists-activation-20261122]
    paths: ['.github/workflows/staging-tier-lists-activation.yml']

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'DarkGuardianMT/myfunlist' && github.ref == 'refs/heads/ops/staging-tier-lists-activation-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_STAGING_SHA: '3c238dd7d63babbee95357a7529ee31a6ec21cb9'
      VITE_OPEN_LIBRARY_DISCOVER_ENABLED: 'true'
      OPEN_LIBRARY_EXPECTED_ACCESS_MODE: ${{ vars.OPEN_LIBRARY_EXPECTED_ACCESS_MODE }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.EXPECTED_STAGING_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        env:
          VITE_TIER_LISTS_ENABLED: 'true'
          VITE_GOOGLE_BOOKS_API_KEY: ${{ secrets.VITE_GOOGLE_BOOKS_API_KEY }}
        run: npm run build

      - name: Set up PHP
        # Vastgezet op de gecontroleerde v2-commit van setup-php.
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer --working-dir=backend validate --strict

      - name: Install backend dependencies
        run: composer --working-dir=backend install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find backend/src backend/config backend/public backend/bin backend/tests \
            -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Run database-independent backend tests
        run: |
          set -euo pipefail
          php backend/tests/database_safety.php
          composer --working-dir=backend run test:providers
          composer --working-dir=backend run test:api

      - name: Validate expected Open Library access mode
        run: |
          node --input-type=module <<'NODE'
          import { verifyOpenLibraryConfiguration } from './scripts/verifyOpenLibraryPilot.mjs'
          verifyOpenLibraryConfiguration(process.env.OPEN_LIBRARY_EXPECTED_ACCESS_MODE, process.env.VITE_OPEN_LIBRARY_DISCOVER_ENABLED)
          NODE

      - name: Configure pinned staging SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_HOST_KEY: ${{ secrets.STAGING_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_STAGING_SHA"
          umask 077
          node scripts/diagnostics/configure-preflight-ssh.mjs

      - name: Update staging checkout
        run: |
          ssh -F "$RUNNER_TEMP/staging-preflight/config" staging bash -s -- "$EXPECTED_STAGING_SHA" <<'REMOTE'
          set -euo pipefail
          cd /home/u403470553/myfunlist-stage
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          # Voorkom dat een oudere build naast een nieuwere backend wordt geplaatst.
          if [ "$(git rev-parse origin/main)" != "$1" ]; then
            echo 'Staging deployment skipped: main has advanced beyond this build.' >&2
            exit 1
          fi
          git reset --hard origin/main
          cd backend
          composer install --no-dev --optimize-autoloader
          REMOTE

      - name: Upload frontend
        run: |
          rsync -rltz --delete \
            --exclude='/.htaccess' \
            --exclude='/api/' \
            -e "ssh -F $RUNNER_TEMP/staging-preflight/config" \
            dist/ \
            staging:/home/u403470553/domains/lightcyan-snake-955164.hostingersite.com/public_html/

      - name: Fix frontend permissions
        run: |
          ssh -F "$RUNNER_TEMP/staging-preflight/config" staging bash -s <<'REMOTE'
          set -euo pipefail
          cd /home/u403470553/domains/lightcyan-snake-955164.hostingersite.com/public_html
          # Laat de API en bestaande Apache-configuratie onaangeroerd.
          find . \( -path './api' -o -name '.htaccess' \) -prune -o \
            -type d -exec chmod 755 {} + -o \
            -type f -exec chmod 644 {} +
          REMOTE

      - name: Verify API health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/staging-health.json" \
            https://lightcyan-snake-955164.hostingersite.com/api/v1/health
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          try {
            const health = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/staging-health.json`, 'utf8'))
            if (health.data?.status !== 'ok') throw new Error()
          } catch {
            console.error('Staging API did not return a healthy JSON response.')
            process.exit(1)
          }
          NODE

      - name: Verify expected Open Library pilot state
        run: |
          status=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/staging-pilot.json" --write-out '%{http_code}' \
            https://lightcyan-snake-955164.hostingersite.com/api/v1/pilot/open-library/search)
          node scripts/verifyOpenLibraryPilot.mjs "$status" "$RUNNER_TEMP/staging-pilot.json"

      - name: Verify Tier Lists auth and frontend assets
        run: |
          set -euo pipefail
          base=https://lightcyan-snake-955164.hostingersite.com
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/staging-tier-lists.json" --write-out '%{http_code}' "$base/api/v1/tier-lists")
          test "$status" = 401
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const response = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/staging-tier-lists.json', 'utf8'))
          if (response.error?.code !== 'unauthenticated') process.exit(1)
          NODE
          curl -fsS --connect-timeout 10 --max-time 30 "$base/tier-lists" > "$RUNNER_TEMP/staging-tier-index.html"
          main_asset=$(grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' "$RUNNER_TEMP/staging-tier-index.html")
          [[ "$main_asset" =~ ^/assets/index-[A-Za-z0-9_-]+\.js$ ]]
          cmp "$RUNNER_TEMP/staging-tier-index.html" dist/index.html
          curl -fsS --connect-timeout 10 --max-time 30 "$base$main_asset" > "$RUNNER_TEMP/staging-tier-index.js"
          cmp "$RUNNER_TEMP/staging-tier-index.js" "dist$main_asset"
          tier_asset=$(find dist/assets -maxdepth 1 -type f -name 'TierListsView-*.js' -printf '%f\n')
          [[ "$tier_asset" =~ ^TierListsView-[A-Za-z0-9_-]+\.js$ ]]
          grep -Fq "$tier_asset" "$RUNNER_TEMP/staging-tier-index.js"
          curl -fsS --connect-timeout 10 --max-time 30 "$base/assets/$tier_asset" > "$RUNNER_TEMP/staging-tier-view.js"
          cmp "$RUNNER_TEMP/staging-tier-view.js" "dist/assets/$tier_asset"
          echo 'Tier Lists routes require authentication and the enabled frontend matches the verified build.'

      - name: Remove SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/staging-preflight"
