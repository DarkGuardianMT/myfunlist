<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('myfunlist_theme') === 'light' ? 'light' : 'dark'
      } catch { document.documentElement.dataset.theme = 'dark' /* Het harnas volgt de gewone applicatie. */ }
    </script>
    <title>MyFunList isolated Open Library QA</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./open-library-harness.js"></script>
  </body>
</html>
